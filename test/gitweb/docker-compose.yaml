services:
  anubis:
    image: ko.local/anubis
    environment:
      BIND: ":8005"
      TARGET: http://gitweb:80
      USE_REMOTE_ADDRESS: "true"
      POLICY_FNAME: /etc/techaro/anubis.yaml
    ports:
      - 8005:8005
    volumes:
      - ./anubis.yaml:/etc/techaro/anubis.yaml

  repo:
    image: jgiannuzzi/gitolite
    ports:
      - "2232:22"
    volumes:
      - repo-data:/var/lib/git
      - ./secrets:/etc/techaro/secrets
    environment:
      - SSH_KEY=ssh-rsa  xe@zohar
      - SSH_KEY_NAME=hunter2

  gitweb:
    image: mlan/gitweb
    depends_on:
      - repo
    volumes:
      - repo-data:/var/lib/git:ro
    ports:
      - 8083:80

volumes:
  repo-data:
